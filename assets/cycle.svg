<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="t d"><title id="t">The day, as a fire</title><desc id="d">Tend during the day, bank it with /hestia:done, keep it overnight while agents are paused, relight in the morning with yesterday's list ready; /hestia:back starts the day.</desc>
