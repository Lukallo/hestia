<g font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#F6EDE3" text-anchor="middle"><text x="120" y="172">Tend</text><text x="360" y="172">Bank</text><text x="600" y="172">Keep</text><text x="840" y="172">Relight</text></g>
